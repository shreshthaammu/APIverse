services:
  - type: web
    name: apiverse-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CLIENT_URL
        value: "https://apiverse-frontend.onrender.com"
      - key: MONGODB_URI
        sync: false

  - type: static
    name: apiverse-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://apiverse-backend.onrender.com"
